<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng sinh nhật chị yêu dấu</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#03050d;
}
body{font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%}
.hint{
  position:fixed;bottom:14px;left:0;right:0;
  text-align:center;color:rgba(255,255,255,.42);
  font-size:12px;letter-spacing:1px;
  pointer-events:none;transition:opacity 1s;
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hint" id="hint">✨ CHÚC MỪNG SINH NHẬT CHỊ CẢ ✨</div>

<script>
(()=>{
const canvas=document.getElementById('scene');
const ctx=canvas.getContext('2d');
const hint=document.getElementById('hint');
let W,H,dpr,stars=[],particles=[],targets=[],trail=[];
let start=performance.now(),last=0;
let textCanvas,textCtx;
const rand=(a,b)=>a+Math.random()*(b-a);

function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  makeStars();
  makeTextTargets();
  initParticles();
}

function makeStars(){
  stars=[];
  const count=Math.max(180,Math.floor(W*H/2300));
  for(let i=0;i<count;i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*H,
      r:rand(.35,1.65),
      a:rand(.18,.9),
      speed:rand(.3,1.8),
      phase:rand(0,Math.PI*2)
    });
  }
}

function makeTextTargets(){
  textCanvas=document.createElement('canvas');
  textCanvas.width=Math.floor(W);
  textCanvas.height=Math.floor(H);
  textCtx=textCanvas.getContext('2d',{willReadFrequently:true});
  textCtx.clearRect(0,0,W,H);

  const lines=['Chúc mừng sinh nhật','Bạn chị dấu'];
  const fontSize=Math.min(W/15,H/7,58);

  textCtx.textAlign='center';
  textCtx.textBaseline='middle';
  textCtx.font=`900 ${fontSize}px Arial,sans-serif`;
  textCtx.fillStyle='#fff';

  const lineGap=fontSize*1.24;
  const cy=H*.49;

  lines.forEach((line,i)=>{
    textCtx.fillText(line,W/2,cy+(i-.5)*lineGap);
  });

  const data=textCtx.getImageData(
    0,0,Math.floor(W),Math.floor(H)
  ).data;

  targets=[];
  const step=Math.max(3,Math.round(fontSize/14));

  for(let y=0;y<H;y+=step){
    for(let x=0;x<W;x+=step){
      const index=(Math.floor(y)*Math.floor(W)+Math.floor(x))*4+3;
      if(data[index]>100){
        targets.push({x:x+rand(-1,1),y:y+rand(-1,1)});
      }
    }
  }
}

function initParticles(){
  particles=[];
  const count=Math.min(
    9000,
    Math.max(targets.length,Math.floor(W*H/90))
  );

  for(let i=0;i<count;i++){
    const target=targets.length
      ?targets[i%targets.length]
      :{x:W/2,y:H/2};

    particles.push({
      x:rand(-W,W*1.3),
      y:rand(-H,H*1.5),
      tx:target.x,
      ty:target.y,
      r:rand(.7,1.9),
      phase:rand(0,6.28),
      hue:rand(12,31),
      speed:rand(.018,.065)});
  }
  trail=[];
}

function glowDot(x,y,r,alpha,hue=23){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=`hsl(${hue},100%,${rand(52,68)}%)`;
  ctx.shadowColor=`hsl(${hue},100%,55%)`;
  ctx.shadowBlur=r*5;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
}

function draw(now){
  const t=(now-start)/1000;
  const dt=Math.min(.04,(now-last)/1000||.016);
  last=now;

  ctx.clearRect(0,0,W,H);

  // Nền vũ trụ
  const bg=ctx.createRadialGradient(
    W*.42,H*.42,0,W*.5,H*.5,Math.max(W,H)*.8
  );
  bg.addColorStop(0,'#111b30');
  bg.addColorStop(.52,'#080d1a');
  bg.addColorStop(1,'#02030a');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  // Sao lấp lánh
  for(const s of stars){
    const tw=.45+.55*Math.sin(t*s.speed+s.phase);
    ctx.globalAlpha=s.a*tw;
    ctx.fillStyle='#dbe8ff';
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();

    if(s.r>1.25){
      ctx.globalAlpha=s.a*tw*.24;
      ctx.fillRect(s.x-3,s.y,s.r*6,.5);
      ctx.fillRect(s.x,s.y-3,.5,s.r*6);
    }
  }
  ctx.globalAlpha=1;

  // Dòng hạt sáng màu cam bay uốn lượn
  const progress=Math.min(1,t/5.8);
  const headX=W*(.02+.96*progress);
  const headY=H*(.83-.36*Math.sin(progress*Math.PI*.92));

  trail.push({x:headX,y:headY,age:0});
  if(trail.length>110)trail.shift();

  trail.forEach((p,i)=>{
    p.age+=dt;
    const fade=1-i/trail.length;

    for(let k=0;k<2;k++){
      const x=p.x+rand(-9,9);
      const y=p.y+rand(-6,6);
      glowDot(x,y,rand(.65,1.9),fade*rand(.25,.85),rand(14,31));
    }
  });

  // Các hạt sáng tập hợp thành dòng chữ
  const settle=Math.min(1,Math.max(0,(t-1.3)/5.5));

  for(const p of particles){
    const sway=Math.sin(t*1.5+p.phase)*(.7+2*(1-settle));
    const jitter=(1-settle)*10;

    const destX=p.tx+Math.sin(t*1.1+p.phase)*jitter;
    const destY=p.ty+Math.cos(t*1.3+p.phase)*jitter;

    p.x+=(destX-p.x)*p.speed;
    p.y+=(destY-p.y)*p.speed;

    const sparkle=.6+.4*Math.sin(t*3+p.phase);

    glowDot(
      p.x+sway,p.y,p.r,
      .55+settle*.4*sparkle,p.hue
    );
  }

  // Các đốm sáng trôi trong không gian
  for(let i=0;i<22;i++){
    const x=(i*137+t*12)%W;
    const y=(i*79+Math.sin(t+i)*28+H*.18)%H;
    glowDot(x,y,rand(.7,1.5),.45,rand(185,220));
  }

  if(t>8)hint.style.opacity='0';
  requestAnimationFrame(draw);
}

// Thay đổi kích thước khi xoay điện thoại
window.addEventListener('resize',resize);

// Chạm màn hình để chạy lại hiệu ứng
canvas.addEventListener('click',()=>{
  start=performance.now();
  makeTextTargets();
  initParticles();
  hint.style.opacity='1';
});

resize();
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
